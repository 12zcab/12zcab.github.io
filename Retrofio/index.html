<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrofio Terminal OS</title>
    <script src="./z80.js"></script>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            font-family: monospace;
            caret-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        .tv {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #term {
            height: 100vh;
            color: #0c7b46;
            font-size: 16px;
            padding: 20px;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            text-shadow: 0 0.2rem 1rem #0c7b46;
            line-height: 1.2em;
            outline: none;
        }
        .cursor {
            background: #0c7b46;
            color: #000;
            animation: blink 1s steps(2, start) infinite;
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            vertical-align: sub;
        }
        @keyframes blink { to { opacity: 0; } }
        .flicker {
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.2);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: flicker 0.12s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.552; } 5% { opacity: 0.48287; } 10% { opacity: 0.59134; }
            15% { opacity: 0.79543; } 20% { opacity: 0.75134; } 25% { opacity: 0.1956; }

            45% { opacity: 0.56977; } 50% { opacity: 0.9925; } 55% { opacity: 0.55487; }
            60% { opacity: 0.16607; } 65% { opacity: 0.12353; } 70% { opacity: 0.2214; }
            75% { opacity: 0.67908; } 80% { opacity: 0.97163; } 85% { opacity: 0.1275; }
            90% { opacity: 0.37186; } 95% { opacity: 0.24475; } 100% { opacity: 0.37221; }
        }
        .scanlines {
            top: 0; left: 0; height: 100%; width: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,.2) 70%, rgba(0,0,0,.6));
            background-size: 100% .3rem;
            position: fixed; 
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>

    // Forward raw key codes straight to the Z80 input queue

        if (e.key.length === 1) {
            inputBuffer.push(e.key.charCodeAt(0));
        } else if (e.key === 'Backspace') {
            inputBuffer.push(0x08); // ASCII BS
        } else if (e.key === 'Enter') {
            inputBuffer.push(0x0A); // ASCII LF
        } else if (e.key === 'Tab') {
            e.preventDefault();
            inputBuffer.push(0x09); // ASCII HT

    window.Z80System = {
        writePort: function(port, value) {
            switch(port & 0xFF) {
                case 0x00: // Terminal Data Output
                    this.processByte(value & 0xFF);
                    break;
                case 0x01: // Command Control
                    if (value === 12) this.clear();
                    break;
                case 0x0F: // CRT Shutoff
                    if (tv) tv.classList.add('collapse');
                    break;
            }
        },
        readPort: function(port) {
            switch(port & 0xFF) {
                case 0x00: return inputBuffer.length > 0 ? inputBuffer.shift() : 0;
                case 0x01: return inputBuffer.length;
                default: return 0;
            }
        },
        processByte: function(byte) {
            switch(byte) {
                case 0x08: // Backspace
                    if (rawScreenBuffer.length > 0) {
                        rawScreenBuffer = rawScreenBuffer.slice(0, -1);
                    }
                    break;
                case 0x0C: // Form Feed (Clear Screen)
                    rawScreenBuffer = "";
                    break;
                case 0x0D: // Carriage Return
                    break; // Ignored when using standard pre-wrap white-space
                default:
                    rawScreenBuffer += String.fromCharCode(byte);
                    break;
            }
            this.renderTerminal();
        },
        clear: function() {
            rawScreenBuffer = "";
            this.renderTerminal();
        },
        renderTerminal: function() {
            term.innerHTML = rawScreenBuffer + '<span class="cursor"> </span>';
            term.scrollTop = term.scrollHeight;
        },
        updateDebugUI: function(cpu) {
            let pc = 0, sp = 0, a = 0, b = 0, hl = 0, de = 0, zf = 0;

            if (typeof cpu.getState === 'function') {
                let state = cpu.getState();
                pc = state.pc; sp = state.sp; a = state.a; b = state.b;
                hl = (state.h << 8) | state.l;
                de = (state.d << 8) | state.e;
                zf = (state.f & 0x40) ? 1 : 0;
            } else {
                pc = cpu.pc || 0; sp = cpu.sp || 0; a = cpu.a || 0; b = cpu.b || 0;
                hl = cpu.hl || 0; de = cpu.de || 0; zf = cpu.f ? (cpu.f & 0x40 ? 1 : 0) : 0;
            }

            debugState = {
                PC: '0x' + pc.toString(16).toUpperCase().padStart(4, '0'),
                SP: '0x' + sp.toString(16).toUpperCase().padStart(4, '0'),
                A:  '0x' + a.toString(16).toUpperCase().padStart(2, '0'),
                B:  '0x' + b.toString(16).toUpperCase().padStart(2, '0'),
                HL: '0x' + hl.toString(16).toUpperCase().padStart(4, '0'),
                DE: '0x' + de.toString(16).toUpperCase().padStart(4, '0'),
                ZeroFlag: zf,
                BufferLength: inputBuffer.length
            };
        },
        getDebugState: function() {
            return debugState;
        }
    };

        mem_read: function(addr) { return ram[addr & 0xFFFF]; },
        mem_write: function(addr, val) { ram[addr & 0xFFFF] = val & 0xFF; },
        io_read: function(port) { return window.Z80System.readPort(port); },
        io_write: function(port, val) { window.Z80System.writePort(port, val); }
    });

        const lines = hexText.split(/\r?\n/);
        for (let line of lines) {
            line = line.trim();

            let recordType = parseInt(line.substr(7, 2), 16);

                    memoryArray[address + i] = dataByte;

                break;
            }
        }
