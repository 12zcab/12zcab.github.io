<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrofio Terminal OS</title>
    <script src="./z80.js"></script>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            font-family: monospace;
            caret-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        .tv {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #term {
            height: 100vh;
            color: #0c7b46;
            font-size: 16px;
            padding: 20px;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            text-shadow: 0 0.2rem 1rem #0c7b46;
            line-height: 1.2em;
            outline: none;
        }
        .cursor {
            background: #0c7b46;
            color: #000;
            animation: blink 1s steps(2, start) infinite;
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            vertical-align: sub;
        }
        @keyframes blink { to { opacity: 0; } }
        .flicker {
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.2);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: flicker 0.12s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.552; } 5% { opacity: 0.48287; } 10% { opacity: 0.59134; }
            15% { opacity: 0.79543; } 20% { opacity: 0.75134; } 25% { opacity: 0.1956; }
            30% { opacity: 0.90687; } 35% { opacity: 0.122; } 40% { opacity: 0.62254; }
            45% { opacity: 0.56977; } 50% { opacity: 0.9925; } 55% { opacity: 0.55487; }
            60% { opacity: 0.16607; } 65% { opacity: 0.12353; } 70% { opacity: 0.2214; }
            75% { opacity: 0.67908; } 80% { opacity: 0.97163; } 85% { opacity: 0.1275; }
            90% { opacity: 0.37186; } 95% { opacity: 0.24475; } 100% { opacity: 0.37221; }
        }
        .scanlines {
            top: 0; left: 0; height: 100%; width: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,.2) 70%, rgba(0,0,0,.6));
            background-size: 100% .3rem;
            position: fixed; 
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="tv">
    <div id="term"></div>
    <div class="flicker"></div>
    <div class="scanlines"></div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var tv = document.querySelector('.tv');
    var term = document.getElementById('term');
    var inputBuffer = [];
    var rawScreenBuffer = "";
    var debugState = {};

    // Forward raw key codes straight to the Z80 input queue
    window.addEventListener('keydown', function(e) {
        if (e.key.length === 1) {
            inputBuffer.push(e.key.charCodeAt(0));
        } else if (e.key === 'Backspace') {
            inputBuffer.push(0x08); // ASCII BS
        } else if (e.key === 'Enter') {
            inputBuffer.push(0x0A); // ASCII LF
        } else if (e.key === 'Tab') {
            e.preventDefault();
            inputBuffer.push(0x09); // ASCII HT
        }
    });

    window.Z80System = {
        // Automatically injects a string into inputBuffer followed by Enter (0x0A)
        typeCommand: function(cmd) {
            for (var i = 0; i < cmd.length; i++) {
                inputBuffer.push(cmd.charCodeAt(i));
            }
            inputBuffer.push(0x0A); // ASCII LF (Enter)
        },
        writePort: function(port, value) {
            switch(port & 0xFF) {
                case 0x00: // Terminal Data Output
                    this.processByte(value & 0xFF);
                    break;
                case 0x01: // Command Control
                    if (value === 12) this.clear();
                    break;
                case 0x0F: // CRT Shutoff
                    if (tv) tv.classList.add('collapse');
                    break;
            }
        },
        readPort: function(port) {
            switch(port & 0xFF) {
                case 0x00: return inputBuffer.length > 0 ? inputBuffer.shift() : 0;
                case 0x01: return inputBuffer.length;
                default: return 0;
            }
        },
        processByte: function(byte) {
            switch(byte) {
                case 0x08: // Backspace
                    if (rawScreenBuffer.length > 0) {
                        rawScreenBuffer = rawScreenBuffer.slice(0, -1);
                    }
                    break;
                case 0x0C: // Form Feed (Clear Screen)
                    rawScreenBuffer = "";
                    break;
                case 0x0D: // Carriage Return
                    break; // Ignored when using standard pre-wrap white-space
                default:
                    rawScreenBuffer += String.fromCharCode(byte);
                    break;
            }
            this.renderTerminal();
        },
        clear: function() {
            rawScreenBuffer = "";
            this.renderTerminal();
        },
        renderTerminal: function() {
            term.innerHTML = rawScreenBuffer + '<span class="cursor"> </span>';
            term.scrollTop = term.scrollHeight;
        },
        updateDebugUI: function(cpu) {
            let pc = 0, sp = 0, a = 0, b = 0, hl = 0, de = 0, zf = 0;

            if (typeof cpu.getState === 'function') {
                let state = cpu.getState();
                pc = state.pc; sp = state.sp; a = state.a; b = state.b;
                hl = (state.h << 8) | state.l;
                de = (state.d << 8) | state.e;
                zf = (state.f & 0x40) ? 1 : 0;
            } else {
                pc = cpu.pc || 0; sp = cpu.sp || 0; a = cpu.a || 0; b = cpu.b || 0;
                hl = cpu.hl || 0; de = cpu.de || 0; zf = cpu.f ? (cpu.f & 0x40 ? 1 : 0) : 0;
            }

            debugState = {
                PC: '0x' + pc.toString(16).toUpperCase().padStart(4, '0'),
                SP: '0x' + sp.toString(16).toUpperCase().padStart(4, '0'),
                A:  '0x' + a.toString(16).toUpperCase().padStart(2, '0'),
                B:  '0x' + b.toString(16).toUpperCase().padStart(2, '0'),
                HL: '0x' + hl.toString(16).toUpperCase().padStart(4, '0'),
                DE: '0x' + de.toString(16).toUpperCase().padStart(4, '0'),
                ZeroFlag: zf,
                BufferLength: inputBuffer.length
            };
        },
        getDebugState: function() {
            return debugState;
        }
    };

    const ram = new Uint8Array(65536);

    const cpu = new Z80({
        mem_read: function(addr) { return ram[addr & 0xFFFF]; },
        mem_write: function(addr, val) { ram[addr & 0xFFFF] = val & 0xFF; },
        io_read: function(port) { return window.Z80System.readPort(port); },
        io_write: function(port, val) { window.Z80System.writePort(port, val); }
    });

    function loadHexToMemory(hexText, memoryArray) {
        const lines = hexText.split(/\r?\n/);
        for (let line of lines) {
            line = line.trim();
            if (!line || line[0] !== ':') continue;
            let byteCount = parseInt(line.substr(1, 2), 16);
            let address = parseInt(line.substr(3, 4), 16);
            let recordType = parseInt(line.substr(7, 2), 16);
            if (recordType === 0x00) {
                for (let i = 0; i < byteCount; i++) {
                    let dataByte = parseInt(line.substr(9 + (i * 2), 2), 16);
                    memoryArray[address + i] = dataByte;
                }
            } else if (recordType === 0x01) {
                break;
            }
        }
    }

    window.Z80System.renderTerminal();

    function runSystemLoop() {
        if (!cpu.halted) {
            const startTime = performance.now();
            while (performance.now() - startTime < 8){
                if (typeof cpu.run_instruction === 'function') {
                    cpu.run_instruction();
                } else if (typeof cpu.step === 'function') {
                    cpu.step();
                }
                if (cpu.halted) break;
            }
            window.Z80System.updateDebugUI(cpu);
            setTimeout(runSystemLoop, 0);
        }
    }

    // Load the external hex file via Fetch API
    fetch('./retrofio.z80.hex')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok: ' + response.statusText);
            }
            return response.text();
        })
        .then(hexText => {
            loadHexToMemory(hexText, ram);
            if (typeof cpu.reset === 'function') cpu.reset();
            runSystemLoop();
        })
        .catch(error => {
            console.error('Error loading hex file:', error);
        });
});
</script>

</body>
</html>
