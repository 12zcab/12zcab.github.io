<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrofio Terminal OS</title>
    <script src="./z80.js"></script>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            font-family: monospace;
            caret-color: transparent;
            user-select: none;
            cursor: default;
        }
        .tv {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        #term {
            height: 100vh;
            width: 80ch;
            max-width: 80ch;
            margin: 0 auto;
            color: #0c7b46;
            font-size: 16px;
            padding: 20px;
            box-sizing: content-box;
            white-space: pre;
            word-wrap: normal;
            overflow-x: hidden;
            overflow-y: auto;
            text-shadow: 0 0.2rem 1rem #0c7b46;
            line-height: 1.2em;
            outline: none;
        }
        .cursor {
            background: #0c7b46;
            color: #000;
            animation: blink 1s steps(2, start) infinite;
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            vertical-align: sub;
        }
        @keyframes blink { to { opacity: 0; } }
        .flicker {
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.2);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: flicker 0.12s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.55; } 50% { opacity: 0.99; } 100% { opacity: 0.37; }
        }
        .scanlines {
            top: 0; left: 0; height: 100%; width: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,.2) 70%, rgba(0,0,0,.6));
            background-size: 100% .3rem;
            position: fixed; 
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="tv">
    <div id="term"></div>
    <div class="flicker"></div>
    <div class="scanlines"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var term = document.getElementById('term');
    var inputBuffer = [];
    var rawScreenBuffer = "";
    var currentColumn = 0;

    // --- 24-BIT EXTENDED VIRTUAL MEMORY & I/O ADDRESS LATCHES ---
    let addressLatch = 0;
    let videoStreamBuffer = new Uint8Array(0);

    // Load binary video stream into JS memory (1 byte = 8 horizontal pixels)
    fetch('./bad_apple_raw.bin')
        .then(response => response.arrayBuffer())
        .then(buffer => {
            videoStreamBuffer = new Uint8Array(buffer);
            console.log("Loaded raw video stream:", videoStreamBuffer.length, "bytes");
        })
        .catch(err => console.error("Error loading binary stream:", err));

    window.addEventListener('keydown', function(e) {
        if (e.key.length === 1) {
            inputBuffer.push(e.key.charCodeAt(0));
        } else if (e.key === 'Backspace') {
            inputBuffer.push(0x08);
        } else if (e.key === 'Enter') {
            inputBuffer.push(0x0A);
        }
    });

    window.Z80System = {
        typeCommand: function(cmd) {
            for (var i = 0; i < cmd.length; i++) {
                inputBuffer.push(cmd.charCodeAt(i));
            }
            inputBuffer.push(0x0A);
        },
        writePort: function(port, value) {
            switch(port & 0xFF) {
                // --- UART OUTPUT ---
                case 0x00:
                    this.processByte(value & 0xFF);
                    break;
                case 0x01:
                    if (value === 12) this.clear();
                    break;

                // --- 24-BIT ADDRESS LATCH PORTS ---
                case 0x02: // Address Bits 0-7
                    addressLatch = (addressLatch & 0xFFFF00) | (value & 0xFF);
                    break;
                case 0x03: // Address Bits 8-15
                    addressLatch = (addressLatch & 0xFF00FF) | ((value & 0xFF) << 8);
                    break;
                case 0x04: // Address Bits 16-23
                    addressLatch = (addressLatch & 0x00FFFF) | ((value & 0xFF) << 16);
                    break;
            }
        },
        readPort: function(port) {
            switch(port & 0xFF) {
                // --- UART INPUT ---
                case 0x00: 
                    return inputBuffer.length > 0 ? inputBuffer.shift() : 0;
                case 0x01: 
                    return inputBuffer.length;

                // --- VIDEO MEMORY FETCH RESPONSE PORT ---
                case 0x05:
                    if (addressLatch < videoStreamBuffer.length) {
                        let dataByte = videoStreamBuffer[addressLatch];
                        addressLatch++; // Auto-advance latch to speed up Z80 reading
                        return dataByte;
                    }
                    return 0x00; // End of Stream

                default: 
                    return 0;
            }
        },
        processByte: function(byte) {
            switch(byte) {
                case 0x08:
                    if (rawScreenBuffer.length > 0) {
                        rawScreenBuffer = rawScreenBuffer.slice(0, -1);
                        if (currentColumn > 0) currentColumn--;
                    }
                    break;
                case 0x0C:
                    rawScreenBuffer = "";
                    currentColumn = 0;
                    break;
                case 0x0A:
                    rawScreenBuffer += "\n";
                    currentColumn = 0;
                    break;
                default:
                    if (currentColumn >= 80) {
                        rawScreenBuffer += "\n";
                        currentColumn = 0;
                    }
                    rawScreenBuffer += String.fromCharCode(byte);
                    currentColumn++;
                    break;
            }
            this.renderTerminal();
        },
        clear: function() {
            rawScreenBuffer = "";
            currentColumn = 0;
            this.renderTerminal();
        },
        renderTerminal: function() {
            term.innerHTML = rawScreenBuffer + '<span class="cursor"> </span>';
            term.scrollTop = term.scrollHeight;
        }
    };

    const ram = new Uint8Array(65536);

    const cpu = new Z80({
        mem_read: function(addr) { return ram[addr & 0xFFFF]; },
        mem_write: function(addr, val) { ram[addr & 0xFFFF] = val & 0xFF; },
        io_read: function(port) { return window.Z80System.readPort(port); },
        io_write: function(port, val) { window.Z80System.writePort(port, val); }
    });

    function loadHexToMemory(hexText, memoryArray) {
        const lines = hexText.split(/\r?\n/);
        for (let line of lines) {
            line = line.trim();
            if (!line || line[0] !== ':') continue;
            let byteCount = parseInt(line.substr(1, 2), 16);
            let address = parseInt(line.substr(3, 4), 16);
            let recordType = parseInt(line.substr(7, 2), 16);
            if (recordType === 0x00) {
                for (let i = 0; i < byteCount; i++) {
                    let dataByte = parseInt(line.substr(9 + (i * 2), 2), 16);
                    memoryArray[address + i] = dataByte;
                }
            } else if (recordType === 0x01) {
                break;
            }
        }
    }

    window.Z80System.renderTerminal();

    function runSystemLoop() {
        if (!cpu.halted) {
            const startTime = performance.now();
            while (performance.now() - startTime < 8){
                if (typeof cpu.run_instruction === 'function') {
                    cpu.run_instruction();
                } else if (typeof cpu.step === 'function') {
                    cpu.step();
                }
                if (cpu.halted) break;
            }
            setTimeout(runSystemLoop, 0);
        }
    }

    fetch('./retrofio.z80.hex')
        .then(response => response.text())
        .then(hexText => {
            loadHexToMemory(hexText, ram);
            if (typeof cpu.reset === 'function') cpu.reset();
            runSystemLoop();
        })
        .catch(error => console.error('Error loading hex file:', error));
});
</script>

</body>
</html>
